<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оформлення замовлення</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 5px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }
        .red-label::after {
            content: " *";
            color: red;
            font-weight: bold;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        .btn-action {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            text-align: center;
        }
        .btn-back {
            background-color: #6c757d;
        }
        .btn-submit {
            background-color: #28a745;
        }
        .btn-action:hover, .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Оформлення замовлення</h1>
    <!-- Огорнуто в тег form для базової валідації полів HTML5 -->
    <form id="orderForm" onsubmit="sendTelegramMessage(event)">
        <div class="form-group">
            <label for="userName" class="red-label">Прізвище та Ім'я:</label>
            <input type="text" id="userName" placeholder="Шевченко Тарас" required>
        </div>
        <div class="form-group">
            <label for="phone" class="red-label">Номер телефону:</label>
            <input type="tel" id="phone" name="phone" value="+38 (" maxlength="19" placeholder="+38 (099) 123-45-67" required>
        </div>
        <div class="form-group">
            <label for="email">e-mail:</label>
            <input type="email" id="email" placeholder="qwerty@gmail.com">
        </div>
        <div class="form-group">
            <label for="deliveryType" class="red-label">Служба доставки:</label>
            <select id="deliveryType" onchange="handleDeliveryChange()">
                <option value="Нова Пошта">Нова Пошта</option>
                <option value="Укрпошта">Укрпошта</option>
            </select>
        </div>
        <div class="form-group">
            <label for="adres" class="red-label">Населений пункт (район/область):</label>
            <input type="text" id="adres" placeholder="м.Київ" required>
        </div>
        <div class="form-group">
            <label for="viddil" class="red-label">Відділення:</label>
            <input type="text" id="viddil" placeholder="" required>
        </div>
        <div class="actions">
            <a id="btn-back" class="btn-action btn-back" href="i_koshik.html">ПОВЕРНУТИСЯ</a>
            <button type="submit" class="btn-submit btn-action">ПІДТВЕРДИТИ ЗАМОВЛЕННЯ</button>
        </div>
    </form>
</div>

<script>
    // --- ТЕЛЕГРАМ ІНТЕГРАЦІЯ ---
    function sendTelegramMessage(event) {
        event.preventDefault(); // Зупиняємо стандартне перезавантаження сторінки

        // ⚠️ ЗАМІНІТЬ ЦІ ДАНІ НА ВЛАСНІ ⚠️
        const BOT_TOKEN = '8955542440:AAHmPiAi99XE9A5RNJaZ0XHKVkmKNjmpVA8'; 
        const CHAT_ID = '5183823576'; 

        // Збір даних з форми
  const name = document.getElementById('userName').value;
  const phone = document.getElementById('phone').value;
  // Зчитуємо емейл та прибираємо зайві пробіли
  const emailInput = document.getElementById('email').value.trim(); 
  const email = emailInput ? emailInput : 'не вказано'; // Перевірка на пусте поле

  const delivery = document.getElementById('deliveryType').value;
  const address = document.getElementById('adres').value;
  const department = document.getElementById('viddil').value;

  // Формування тексту повідомлення
  const text = `📦 *Нове замовлення!*\n\n` +
             `👤 *Покупець:* ${name}\n` +
             `📞 *Телефон:* ${phone}\n` +
             `📧 *Email:* ${email}\n` +
             `🚚 *Доставка:* ${delivery}\n` +
             `📍 *Місто:* ${address}\n` +
             `🏢 *Відділення:* ${department}`;

        // URL для запиту до Telegram API
        const url = `https://telegram.org{BOT_TOKEN}/sendMessage`;

        // Виконання HTTP-запиту
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            if (response.ok) {
                alert('Замовлення успішно оформлено та надіслано!');
                // Тут можна додати перенаправлення на сторінку "Дякуємо за замовлення"
                // window.location.href = 'thanks.html';
            } else {
                alert('Помилка відправки замовлення. Спробуйте ще раз.');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Сталася помилка з\'єднання.');
        });
    }

    // --- ЛОГІКА ТЕЛЕФОНУ ---
    const phoneInput = document.getElementById('phone');
    phoneInput.addEventListener('input', (e) => {
        if (e.inputType === 'deleteContentBackward') return;
        let input = e.target.value;
        let digits = input.replace(/\D/g, '');
        if (!digits.startsWith('38')) digits = '38' + digits;
        let formatted = '+38 (';
        digits = digits.substring(2, 12);
        if (digits.length > 0) formatted += digits.substring(0, 3);
        if (digits.length >= 3) formatted += ') ';
        if (digits.length > 3) formatted += digits.substring(3, 6);
        if (digits.length >= 6) formatted += '-';
        if (digits.length > 6) formatted += digits.substring(6, 8);
        if (digits.length >= 8) formatted += '-';
        if (digits.length > 8) formatted += digits.substring(8, 10);
        e.target.value = formatted;
    });

    phoneInput.addEventListener('keydown', (e) => {
        const val = e.target.value;
        if (e.key === 'Backspace') {
            if (val.length <= 5) {
                e.preventDefault();
                return;
            }
            if (val.endsWith('-')) {
                e.target.value = val.substring(0, val.length - 1);
            } else if (val.endsWith(') ')) {
                e.target.value = val.substring(0, val.length - 2);
            }
        }
    });

    // --- ЛОГІКА ПОВЕРНЕННЯ В КОШИК ---
    function setupBackButton() {
        const urlParams = new URLSearchParams(window.location.search);
        const extractedIds = [];
        const extractedQtys = [];
        for (let i = 0; urlParams.has(`id[${i}]`); i++) {
            extractedIds.push(urlParams.get(`id[${i}]`));
            extractedQtys.push(urlParams.get(`qty[${i}]`) || '1');
        }
        const idsQuery = extractedIds.join(',');
        const qtysQuery = extractedQtys.join(',');
        document.getElementById('btn-back').href = `i_koshik.html?ids=${idsQuery}&qtys=${qtysQuery}`;
    }
    setupBackButton();
    window.handleDeliveryChange = function() {};
</script>
</body>
</html>
